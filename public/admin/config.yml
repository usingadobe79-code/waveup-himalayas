# Sveltia CMS configuration. base_url points at the GitHub sign-in helper
# (the sveltia-cms-auth Cloudflare Worker).
backend:
  name: github
  repo: usingadobe79-code/waveup-himalayas
  branch: main
  base_url: "https://sveltia-cms-auth.usingadobe79.workers.dev"

# Uploaded images are committed here (repo path) and referenced by the public path.
media_folder: "/public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Write and publish blog posts. Click Publish and the site updates in a couple of minutes."
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Short summary (shown on cards and in Google)", name: "excerpt", widget: "text" }
      - { label: "Cover image", name: "coverImage", widget: "image" }
      - { label: "Author", name: "author", widget: "string", default: "WaveUp Himalayas" }
      - { label: "Draft (keep hidden from the site)", name: "draft", widget: "boolean", default: false }
      - label: "Recommended treks (shown in the sidebar)"
        name: "relatedPackages"
        widget: "relation"
        collection: "packages"
        value_field: "{{slug}}"
        search_fields: ["title"]
        display_fields: ["title"]
        multiple: true
        required: false
      - { label: "SEO title (Google title — optional)", name: "seoTitle", widget: "string", required: false, hint: "Custom title for Google results, ~60 characters. Leave blank to use the default." }
      - { label: "SEO description (Google snippet — optional)", name: "seoDescription", widget: "text", required: false, hint: "Custom description for Google, ~155 characters. Leave blank to use the short description/excerpt." }
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        label_singular: "FAQ"
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - label: "Tables"
        name: "tables"
        widget: "list"
        required: false
        label_singular: "Table"
        summary: "{{fields.caption}}"
        hint: "Fill in boxes — no symbols. To place a table at a specific spot in your post, type {{table1}} (or {{table2}}…) in the Body where you want it; otherwise tables appear after your article."
        fields:
          - { label: "Caption (optional)", name: "caption", widget: "string", required: false, hint: "Shown above the table." }
          - label: "Column headers"
            name: "headers"
            widget: "list"
            hint: "Add one per column, e.g. Day, Route, Altitude, Hours"
            field: { label: "Header", name: "header", widget: "string" }
          - label: "Rows"
            name: "rows"
            widget: "list"
            required: false
            label_singular: "Row"
            fields:
              - label: "Cells"
                name: "cells"
                widget: "list"
                hint: "One cell per column, in header order."
                field: { label: "Cell", name: "cell", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "packages"
    label: "Packages"
    label_singular: "Package"
    description: "Add or edit a trek or tour. Click Publish and the site updates in a couple of minutes."
    folder: "content/packages"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["title", "regionKey"]
    media_folder: "/public/images/packages"
    public_folder: "/images/packages"
    fields:
      - { label: "Trip name", name: "title", widget: "string" }
      - label: "Region"
        name: "regionKey"
        widget: "select"
        options:
          - { label: "Everest Region", value: "everest" }
          - { label: "Annapurna Region", value: "annapurna" }
          - { label: "Manaslu / Langtang", value: "manaslu-langtang" }
          - { label: "Cultural Tours", value: "cultural" }
          - { label: "Wildlife", value: "wildlife" }
          - { label: "Special", value: "special" }
      - label: "Trip type"
        name: "serviceKey"
        widget: "select"
        options:
          - { label: "Trekking", value: "trekking" }
          - { label: "Helicopter Tour", value: "heli-tours" }
          - { label: "Mountain Flight", value: "mountain-flights" }
          - { label: "City Tour", value: "city-tours" }
          - { label: "Jungle Safari", value: "jungle-safari" }
          - { label: "Custom Trip", value: "custom-trips" }
      - { label: "Price in USD (leave blank for 'Price on enquiry')", name: "price", widget: "number", required: false, value_type: "int", min: 0 }
      - { label: "Original price in USD (for showing a discount)", name: "originalPrice", widget: "number", required: false, value_type: "int", min: 0, hint: "If higher than the Price above, the card shows it crossed out with an automatic % OFF badge." }
      - { label: "Offer label (badge)", name: "offerLabel", widget: "string", required: false, hint: "e.g. 'Autumn Special' or 'Early Bird' — shows as a small badge. Optional." }
      - { label: "Cover photo", name: "image", widget: "image", required: false }
      - { label: "Short description (shown on trip cards)", name: "blurb", widget: "text", required: false }
      - { label: "Overview", name: "overview", widget: "markdown", required: false, hint: "Main overview of the trek. Use headings, bold, bullets, links." }
      - { label: "SEO title (Google title — optional)", name: "seoTitle", widget: "string", required: false, hint: "Custom title for Google results, ~60 characters. Leave blank to use the default." }
      - { label: "SEO description (Google snippet — optional)", name: "seoDescription", widget: "text", required: false, hint: "Custom description for Google, ~155 characters. Leave blank to use the short description/excerpt." }
      - { label: "Show on homepage (Popular Adventures)", name: "featured", widget: "boolean", default: false }
      - { label: "Draft (keep hidden from the site)", name: "draft", widget: "boolean", default: false }
      - { label: "Itinerary — short summary (optional)", name: "itinerarySummary", widget: "text", required: false, hint: "Optional one-line summary; used as the Overview fallback when the Overview field above is empty." }
      - label: "Itinerary — trip highlights"
        name: "itineraryHighlights"
        widget: "list"
        required: false
        field: { label: "Highlight", name: "highlight", widget: "string" }
      - label: "Itinerary — good to know / notes"
        name: "itineraryNotes"
        widget: "list"
        required: false
        field: { label: "Note", name: "note", widget: "string" }
      - label: "Itinerary — day by day"
        name: "itineraryDays"
        widget: "list"
        required: false
        hint: "For day-by-day treks."
        label_singular: "Day"
        summary: "Day {{fields.day}} — {{fields.route}}"
        fields:
          - { label: "Day number", name: "day", widget: "number", value_type: "int", min: 1 }
          - { label: "Route / title", name: "route", widget: "string" }
          - { label: "Altitude (optional)", name: "altitude", widget: "string", required: false }
          - { label: "Duration / hours (optional)", name: "duration", widget: "string", required: false }
          - { label: "Description (optional)", name: "description", widget: "text", required: false }
          - label: "Photo (optional)"
            name: "image"
            widget: "image"
            required: false
            hint: "Optional photo for this day — shows when the day is expanded."
          - { label: "Day highlights (optional)", name: "highlights", widget: "string", required: false }
      - label: "Itinerary — peaks you'll see (heli / flight tours)"
        name: "itineraryPeaks"
        widget: "list"
        required: false
        collapsed: true
        hint: "For helicopter / mountain-flight tours only."
        field: { label: "Peak", name: "peak", widget: "string" }
      - label: "Itinerary — time schedule (heli / flight tours)"
        name: "itinerarySchedule"
        widget: "list"
        required: false
        collapsed: true
        label_singular: "Section"
        hint: "For helicopter / mountain-flight tours only — grouped time + activity rows. Leave empty for day-by-day treks."
        summary: "{{fields.title}}"
        fields:
          - { label: "Section title (optional)", name: "title", widget: "string", required: false }
          - label: "Rows"
            name: "rows"
            widget: "list"
            label_singular: "Row"
            summary: "{{fields.time}} — {{fields.activity}}"
            fields:
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Activity", name: "activity", widget: "string" }
      - label: "Trip facts"
        name: "tripFacts"
        widget: "object"
        required: false
        collapsed: true
        hint: "Shown in the Trip Facts box on the trip page. Leave any field blank to hide it."
        fields:
          - { label: "Duration (e.g. '14 days')", name: "duration", widget: "string", required: false }
          - label: "Difficulty"
            name: "difficulty"
            widget: "select"
            required: false
            options:
              - "Easy"
              - "Moderate"
              - "Moderately challenging"
              - "Challenging"
              - "Strenuous"
          - { label: "Max altitude (e.g. '5,160 m')", name: "maxAltitude", widget: "string", required: false }
          - { label: "Best season (e.g. 'Autumn & Spring')", name: "bestSeason", widget: "string", required: false }
          - { label: "Group size (e.g. '1–20')", name: "groupSize", widget: "string", required: false }
          - { label: "Accommodation (e.g. 'Hotel + teahouse')", name: "accommodation", widget: "string", required: false }
          - { label: "Meals (e.g. 'Breakfast, lunch & dinner on the trek')", name: "meals", widget: "string", required: false }
          - { label: "Trek distance (e.g. '177 km / 110 mi')", name: "trekDistance", widget: "string", required: false }
          - { label: "Start / End point (e.g. 'Kathmandu')", name: "startEndPoint", widget: "string", required: false }
      - label: "What's included"
        name: "includes"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }
      - label: "What's NOT included"
        name: "excludes"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        label_singular: "FAQ"
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - label: "Photo gallery"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }
      - { label: "Route map", name: "routeMap", widget: "image", required: false }
      - label: "What to pack"
        name: "packingList"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }
      - label: "Know before you go"
        name: "preparation"
        widget: "markdown"
        required: false
        hint: "Optional fitness/training guidance, shown as a \"Know before you go\" section on the trip page."

  - name: "siteContent"
    label: "Homepage sections"
    files:
      - name: "offers"
        label: "Current Offers (homepage)"
        description: "Edit the 'Current Offers' section on the homepage. Click Publish and the site updates in a couple of minutes."
        file: "content/offers.md"
        media_folder: "/public/images/offers"
        public_folder: "/images/offers"
        fields:
          - { label: "Eyebrow (small label above the heading)", name: "eyebrow", widget: "string", default: "Limited Time" }
          - { label: "Heading", name: "title", widget: "string", default: "Current Offers" }
          - { label: "Intro text", name: "intro", widget: "text" }
          - label: "Offer cards"
            name: "offers"
            widget: "list"
            label_singular: "Offer"
            summary: "{{fields.title}}"
            fields:
              - { label: "Badge (e.g. '-20%')", name: "label", widget: "string", hint: "Free text — shown in the gold badge, followed by the word 'off'." }
              - { label: "Offer title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Button text", name: "buttonText", widget: "string", default: "Claim This Offer" }
              - { label: "Custom link (optional)", name: "customUrl", widget: "string", required: false, hint: "Leave blank to send enquiries to WhatsApp (default). Set this to override the button's link with a custom URL instead." }
              - { label: "Photo (optional)", name: "image", widget: "image", required: false }
              - { label: "Valid until / note (optional)", name: "validUntil", widget: "string", required: false, hint: "e.g. 'Valid until 30 Nov' — shown as a small note under the description." }

      - name: "about"
        label: "About Page"
        description: "Edit the /about page — company intro, mission and Why Choose Us. Click Publish and the site updates in a couple of minutes."
        file: "content/about.md"
        fields:
          - { label: "Eyebrow (small label above the heading)", name: "eyebrow", widget: "string", default: "About Us" }
          - { label: "Heading", name: "title", widget: "string", default: "About WaveUp Himalayas" }
          - label: "Introduction"
            name: "intro"
            widget: "markdown"
            hint: "A few paragraphs introducing the company — who you are, where you're based and how you work. Keep it general and truthful (no invented stats, years or awards)."
          - label: "Our Mission — 3 points"
            name: "mission"
            widget: "list"
            label_singular: "Point"
            summary: "{{fields.title}}"
            hint: "Designed for exactly 3 points."
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Why Choose Us — 6 features"
            name: "whyUs"
            widget: "list"
            label_singular: "Feature"
            summary: "{{fields.title}}"
            hint: "Designed for exactly 6 features, shown as a grid of cards."
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Icon (optional)"
                name: "icon"
                widget: "select"
                required: false
                hint: "Leave blank for a default icon."
                options:
                  - { label: "Map pin — local knowledge", value: "map-pinned" }
                  - { label: "Shield check — safety / licensed", value: "shield-check" }
                  - { label: "Sliders — customizable", value: "sliders-horizontal" }
                  - { label: "Mountain — treks & trips", value: "mountain-snow" }
                  - { label: "Message bubble — communication", value: "message-circle" }
                  - { label: "Heart handshake — care & support", value: "heart-handshake" }
                  - { label: "Users — team & guides", value: "users" }
                  - { label: "Globe — local expertise", value: "globe" }
                  - { label: "Compass — planning", value: "compass" }
                  - { label: "Clock — availability", value: "clock" }

  - name: "team"
    label: "Team"
    label_singular: "Team member"
    description: "Add or edit a team member shown on the About page. Click Publish and the site updates in a couple of minutes."
    folder: "content/team"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["order", "name"]
    media_folder: "/public/images/team"
    public_folder: "/images/team"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role / title", name: "role", widget: "string" }
      - { label: "Photo (optional)", name: "photo", widget: "image", required: false }
      - { label: "Order (lower numbers show first)", name: "order", widget: "number", required: false, value_type: "int", hint: "Optional — leave blank to sort by name." }
      - { label: "Short bio (optional)", name: "bio", widget: "text", required: false }
