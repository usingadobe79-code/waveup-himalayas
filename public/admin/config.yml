# Sveltia CMS configuration. base_url points at the GitHub sign-in helper
# (the sveltia-cms-auth Cloudflare Worker).
backend:
  name: github
  repo: usingadobe79-code/waveup-himalayas
  branch: main
  base_url: "https://sveltia-cms-auth.usingadobe79.workers.dev"

# Uploaded images are committed here (repo path) and referenced by the public path.
media_folder: "/public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Write and publish blog posts. Click Publish and the site updates in a couple of minutes."
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Short summary (shown on cards and in Google)", name: "excerpt", widget: "text" }
      - { label: "Cover image", name: "coverImage", widget: "image" }
      - { label: "Author", name: "author", widget: "string", default: "WaveUp Himalayas" }
      - { label: "Draft (keep hidden from the site)", name: "draft", widget: "boolean", default: false }
      - label: "Recommended treks (shown in the sidebar)"
        name: "relatedPackages"
        widget: "relation"
        collection: "packages"
        value_field: "{{slug}}"
        search_fields: ["title"]
        display_fields: ["title"]
        multiple: true
        required: false
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "packages"
    label: "Packages"
    label_singular: "Package"
    description: "Add or edit a trek or tour. Click Publish and the site updates in a couple of minutes."
    folder: "content/packages"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["title", "regionKey"]
    media_folder: "/public/images/packages"
    public_folder: "/images/packages"
    fields:
      - { label: "Trip name", name: "title", widget: "string" }
      - label: "Region"
        name: "regionKey"
        widget: "select"
        options:
          - { label: "Everest Region", value: "everest" }
          - { label: "Annapurna Region", value: "annapurna" }
          - { label: "Manaslu / Langtang", value: "manaslu-langtang" }
          - { label: "Cultural Tours", value: "cultural" }
          - { label: "Wildlife", value: "wildlife" }
          - { label: "Special", value: "special" }
      - label: "Trip type"
        name: "serviceKey"
        widget: "select"
        options:
          - { label: "Trekking", value: "trekking" }
          - { label: "Helicopter Tour", value: "heli-tours" }
          - { label: "Mountain Flight", value: "mountain-flights" }
          - { label: "City Tour", value: "city-tours" }
          - { label: "Jungle Safari", value: "jungle-safari" }
          - { label: "Custom Trip", value: "custom-trips" }
      - { label: "Price in USD (leave blank for 'Price on enquiry')", name: "price", widget: "number", required: false, value_type: "int", min: 0 }
      - { label: "Original price in USD (for showing a discount)", name: "originalPrice", widget: "number", required: false, value_type: "int", min: 0, hint: "If higher than the Price above, the card shows it crossed out with an automatic % OFF badge." }
      - { label: "Offer label (badge)", name: "offerLabel", widget: "string", required: false, hint: "e.g. 'Autumn Special' or 'Early Bird' — shows as a small badge. Optional." }
      - { label: "Cover photo", name: "image", widget: "image", required: false }
      - { label: "Short description (shown on trip cards)", name: "blurb", widget: "text", required: false }
      - { label: "Show on homepage (Popular Adventures)", name: "featured", widget: "boolean", default: false }
      - { label: "Itinerary — overview", name: "itinerarySummary", widget: "text", required: false }
      - label: "Itinerary — trip highlights"
        name: "itineraryHighlights"
        widget: "list"
        required: false
        field: { label: "Highlight", name: "highlight", widget: "string" }
      - label: "Itinerary — good to know / notes"
        name: "itineraryNotes"
        widget: "list"
        required: false
        field: { label: "Note", name: "note", widget: "string" }
      - label: "Itinerary — day by day"
        name: "itineraryDays"
        widget: "list"
        required: false
        hint: "For day-by-day treks."
        label_singular: "Day"
        summary: "Day {{fields.day}} — {{fields.route}}"
        fields:
          - { label: "Day number", name: "day", widget: "number", value_type: "int", min: 1 }
          - { label: "Route / title", name: "route", widget: "string" }
          - { label: "Altitude (optional)", name: "altitude", widget: "string", required: false }
          - { label: "Duration / hours (optional)", name: "duration", widget: "string", required: false }
          - { label: "Description (optional)", name: "description", widget: "text", required: false }
          - { label: "Day highlights (optional)", name: "highlights", widget: "string", required: false }
      - label: "Itinerary — peaks you'll see (heli / flight tours)"
        name: "itineraryPeaks"
        widget: "list"
        required: false
        collapsed: true
        hint: "For helicopter / mountain-flight tours only."
        field: { label: "Peak", name: "peak", widget: "string" }
      - label: "Itinerary — time schedule (heli / flight tours)"
        name: "itinerarySchedule"
        widget: "list"
        required: false
        collapsed: true
        label_singular: "Section"
        hint: "For helicopter / mountain-flight tours only — grouped time + activity rows. Leave empty for day-by-day treks."
        summary: "{{fields.title}}"
        fields:
          - { label: "Section title (optional)", name: "title", widget: "string", required: false }
          - label: "Rows"
            name: "rows"
            widget: "list"
            label_singular: "Row"
            summary: "{{fields.time}} — {{fields.activity}}"
            fields:
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Activity", name: "activity", widget: "string" }
      - label: "Trip facts"
        name: "tripFacts"
        widget: "object"
        required: false
        collapsed: true
        hint: "Shown in the Trip Facts box on the trip page. Leave any field blank to hide it."
        fields:
          - { label: "Duration (e.g. '14 days')", name: "duration", widget: "string", required: false }
          - label: "Difficulty"
            name: "difficulty"
            widget: "select"
            required: false
            options:
              - "Easy"
              - "Moderate"
              - "Moderately challenging"
              - "Challenging"
              - "Strenuous"
          - { label: "Max altitude (e.g. '5,160 m')", name: "maxAltitude", widget: "string", required: false }
          - { label: "Best season (e.g. 'Autumn & Spring')", name: "bestSeason", widget: "string", required: false }
          - { label: "Group size (e.g. '1–20')", name: "groupSize", widget: "string", required: false }
          - { label: "Accommodation (e.g. 'Hotel + teahouse')", name: "accommodation", widget: "string", required: false }
          - { label: "Meals (e.g. 'Breakfast, lunch & dinner on the trek')", name: "meals", widget: "string", required: false }
          - { label: "Trek distance (e.g. '177 km / 110 mi')", name: "trekDistance", widget: "string", required: false }
          - { label: "Start / End point (e.g. 'Kathmandu')", name: "startEndPoint", widget: "string", required: false }
      - label: "What's included"
        name: "includes"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }
      - label: "What's NOT included"
        name: "excludes"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        label_singular: "FAQ"
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - label: "Photo gallery"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Photo", name: "photo", widget: "image" }
      - { label: "Route map", name: "routeMap", widget: "image", required: false }
      - label: "What to pack"
        name: "packingList"
        widget: "list"
        required: false
        field: { label: "Item", name: "item", widget: "string" }
      - label: "How to prepare (fitness/training)"
        name: "preparation"
        widget: "markdown"
        required: false
        hint: "Optional fitness/training guidance, shown as a \"How to prepare\" section on the trip page."
